name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: copilot_user
          POSTGRES_PASSWORD: copilot_pass
          POSTGRES_DB: copilot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot_user -d copilot_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Valeurs factices : aucun test n'appelle réellement Gemini ou le
      # rôle read-only, mais Settings() a besoin de ces variables pour
      # s'instancier sans erreur (validation Pydantic).
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      GEMINI_MODEL: gemini-2.5-flash
      DATABASE_URL: postgresql://copilot_user:copilot_pass@localhost:5432/copilot_db
      DATABASE_URL_READONLY: postgresql://copilot_user:copilot_pass@localhost:5432/copilot_db
      READONLY_DB_PASSWORD: ci-placeholder-pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (Ruff)
        working-directory: backend
        run: ruff check .

      - name: Créer les tables (stores/sales/conversations/messages)
        working-directory: backend
        run: python -m scripts.init_db

      - name: Tests (unit + integration)
        working-directory: backend
        run: pytest -v

      - name: Build de l'image Docker (vérifie que le Dockerfile est valide)
        working-directory: backend
        run: docker build -t ai-data-copilot-backend:ci .
