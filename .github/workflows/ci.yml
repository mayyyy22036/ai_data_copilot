name: CI

on:
  push:
    branches:
      - master
      - may
  pull_request:
    branches:
      - master
      - may

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: copilot_user
          POSTGRES_PASSWORD: copilot_password
          POSTGRES_DB: copilot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U copilot_user -d copilot_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GEMINI_API_KEY: test-key
          GEMINI_MODEL: gemini-1.5-flash
          DATABASE_URL: postgresql://copilot_user:copilot_password@localhost:5432/copilot_db
          DATABASE_URL_READONLY: postgresql://copilot_user:copilot_password@localhost:5432/copilot_db
          READONLY_DB_PASSWORD: copilot_password
          CHROMA_PERSIST_DIR: ./chroma_db
          PORT: 8000
          ENVIRONMENT: test
          LOG_LEVEL: INFO
          ALLOWED_ORIGINS: http://localhost:3000
        run: pytest -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-data-copilot:ci ./backend